name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs vcvars64.bat and exports the variables it changes to later steps.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools not found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # v4.5.0

      - name: Configure vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release

      - name: Test
        run: ctest --preset x64-release

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Item out\build\x64-release\OLEDbar.exe).VersionInfo.ProductVersion
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match project(VERSION $version) in CMakeLists.txt"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: ./packaging/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OLEDbar-packages
          path: out/dist/
          if-no-files-found: error

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # Also read by packaging/azure-sign.ps1, which Inno Setup calls to sign the installer and uninstaller.
      SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      SIGNING_ACCOUNT: OLEDbar
      SIGNING_PROFILE: OLEDbarPublic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OLEDbar-packages
          path: ${{ runner.temp }}/unsigned

      - name: Prepare release files
        id: prepare
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $zip = Join-Path $env:RUNNER_TEMP "unsigned\OLEDbar-$version-x64.zip"
          if (-not (Test-Path $zip)) { throw "Portable package not found: $zip" }
          $appDir = Join-Path $env:RUNNER_TEMP 'app'
          Expand-Archive -LiteralPath $zip -DestinationPath $appDir
          $app = Join-Path $appDir 'OLEDbar.exe'
          if (-not (Test-Path $app)) { throw "Packaged OLEDbar.exe not found: $app" }
          "OLED_VERSION=$version" >> $env:GITHUB_ENV
          "OLED_APP_DIR=$appDir" >> $env:GITHUB_ENV
          "app-path=$app" >> $env:GITHUB_OUTPUT

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signed before packaging so both the zip and the installer carry the signed EXE.
      # This also installs the ArtifactSigning module that packaging/azure-sign.ps1 uses.
      - name: Sign OLEDbar.exe
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ steps.prepare.outputs.app-path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package with signed installer and uninstaller
        shell: pwsh
        run: ./packaging/package.ps1 -BuildDir $env:OLED_APP_DIR -Sign

      # Installs to a temp folder so the EXE inside the installer and the generated uninstaller are checked too.
      - name: Verify signatures
        shell: pwsh
        run: |
          function Assert-Signed([string]$file) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Signature verification failed for $file ($($signature.Status)): $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The signature has no trusted timestamp: $file"
            }
            Write-Host "Verified signed file: $file"
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'out\dist'
          $zip = Join-Path $dist "OLEDbar-$env:OLED_VERSION-x64.zip"
          $setup = Join-Path $dist "OLEDbar-$env:OLED_VERSION-x64-setup.exe"
          Assert-Signed $setup

          $zipDir = Join-Path $env:RUNNER_TEMP 'verify-zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $zipDir
          Assert-Signed (Join-Path $zipDir 'OLEDbar.exe')

          $installDir = Join-Path $env:RUNNER_TEMP 'verify-install'
          $install = Start-Process $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!startup', "/DIR=`"$installDir`"")
          if ($install.ExitCode -ne 0) { throw "Test install failed with exit code $($install.ExitCode)" }
          $installed = @(Get-ChildItem $installDir -Filter *.exe -File)
          if (-not ($installed.Name -contains 'OLEDbar.exe') -or -not ($installed.Name -like 'unins*.exe')) {
            throw "Unexpected installed files: $($installed.Name -join ', ')"
          }
          $installed | ForEach-Object { Assert-Signed $_.FullName }
          $uninstaller = $installed | Where-Object Name -like 'unins*.exe' | Select-Object -First 1
          $uninstall = Start-Process $uninstaller.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "Test uninstall failed with exit code $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OLEDbar-signed-packages
          path: out/dist/
          if-no-files-found: error

  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OLEDbar-signed-packages
          path: dist

      # Created as a draft so the release notes and files can be checked before publishing.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body: |
            > [!IMPORTANT]
            > The executable and installer are signed with Microsoft Artifact Signing and timestamped. SmartScreen warnings may still appear while download reputation builds.
            > See [Code signing policy](https://github.com/midimaxi-dev/OLEDbar#code-signing-policy) in the README.
          generate_release_notes: true
          files: dist/*
