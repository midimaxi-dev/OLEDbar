name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs vcvars64.bat and exports the variables it changes to later steps.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools not found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - name: Configure vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release

      - name: Test
        run: ctest --preset x64-release

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Item out\build\x64-release\OLEDbar.exe).VersionInfo.ProductVersion
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match project(VERSION $version) in CMakeLists.txt"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: ./packaging/package.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OLEDbar-packages
          path: out/dist/
          if-no-files-found: error

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OLEDbar-packages
          path: out/dist

      - name: Prepare release files
        id: prepare
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $dist = Join-Path $env:GITHUB_WORKSPACE 'out\dist'
          $zip = Join-Path $dist "OLEDbar-$version-x64.zip"
          $setup = Join-Path $dist "OLEDbar-$version-x64-setup.exe"
          $stage = Join-Path $env:RUNNER_TEMP "OLEDbar-$version-x64"
          if (-not (Test-Path $zip)) { throw "Portable package not found: $zip" }
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          $app = Join-Path $stage 'OLEDbar.exe'
          if (-not (Test-Path $app)) { throw "Packaged OLEDbar.exe not found: $app" }
          "OLED_VERSION=$version" >> $env:GITHUB_ENV
          "OLED_ZIP_PATH=$zip" >> $env:GITHUB_ENV
          "OLED_SETUP_PATH=$setup" >> $env:GITHUB_ENV
          "OLED_STAGE_PATH=$stage" >> $env:GITHUB_ENV
          "OLED_APP_PATH=$app" >> $env:GITHUB_ENV
          "app-path=$app" >> $env:GITHUB_OUTPUT
          "setup-path=$setup" >> $env:GITHUB_OUTPUT

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release files
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: OLEDbar
          certificate-profile-name: OLEDbarPublic
          files: |
            ${{ steps.prepare.outputs.app-path }}
            ${{ steps.prepare.outputs.setup-path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signatures and refresh checksums
        shell: pwsh
        run: |
          foreach ($file in @($env:OLED_APP_PATH, $env:OLED_SETUP_PATH)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Signature verification failed for $file ($($signature.Status)): $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The signature has no trusted timestamp: $file"
            }
            Write-Host "Verified signed file: $file"
          }
          if (Test-Path $env:OLED_ZIP_PATH) { Remove-Item -LiteralPath $env:OLED_ZIP_PATH }
          Compress-Archive -Path (Join-Path $env:OLED_STAGE_PATH '*') `
            -DestinationPath $env:OLED_ZIP_PATH -CompressionLevel Optimal
          Get-ChildItem $env:GITHUB_WORKSPACE\out\dist -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-setup.exe' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'out\dist\SHA256SUMS.txt') -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OLEDbar-signed-packages
          path: out/dist/
          if-no-files-found: error

  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OLEDbar-signed-packages
          path: dist

      # Created as a draft so the release notes and files can be checked before publishing.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: |
            > [!IMPORTANT]
            > The executable and installer are signed with Microsoft Artifact Signing and timestamped. SmartScreen warnings may still appear while download reputation builds.
            > See [Code signing policy](https://github.com/midimaxi-dev/OLEDbar#code-signing-policy) in the README.
          generate_release_notes: true
          files: dist/*
